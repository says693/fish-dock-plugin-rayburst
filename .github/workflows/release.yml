name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rayburst-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'says693/fish-dock-plugin-rayburst'
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected vX.Y.Z release tag' }
      - name: Checkout release ref
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Setup trusted publishing CLI
        run: npm install --global npm@11.17.0
      - name: Install development dependencies
        run: npm ci
      - name: Prepare pinned engine and corresponding source
        run: npm run vendor:engine
      - name: Syntax checks
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify Dock package and catalog
        run: npm run verify
      - name: Validate version and release notes
        shell: pwsh
        run: |
          npm run release:check -- $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release validation failed" }
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $engineSource = (Get-Content -Raw 'dist/manifest.json' | ConvertFrom-Json).engineSource.file
          $assets = @(
            "dist/rayburst.fish-plugin",
            "dist/rayburst-fish-plugin-source.zip",
            "dist/$engineSource",
            "dist/SHA256SUMS.txt",
            "dist/manifest.json",
            "dist/catalog.json"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Rayburst FISH-Dock 插件 $tag" --notes-file "dist/RELEASE_NOTES.md"
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --title "Rayburst FISH-Dock 插件 $tag" --notes-file "dist/RELEASE_NOTES.md" --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
      - name: Publish verified npm package with OIDC
        run: npm publish --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org
