name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Prepare pinned engine and corresponding source
        run: npm run vendor:engine
      - name: Syntax checks
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify Dock package and catalog
        run: npm run verify
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rayburst-fish-plugin
          path: dist/
          retention-days: 7
